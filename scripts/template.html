<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bellingham Daily</title>
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bellingham">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fbfaf6;
    --ink: #161616;
    --muted: #6f6a60;
    --rule: #d9d3c5;
    --accent: #d2452a;
    --chip-bg: #e9e4d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --paper: #1b1b1b;
      --ink: #f1eee6;
      --muted: #9b968b;
      --rule: #2f2d29;
      --accent: #ff6a4d;
      --chip-bg: #262522;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 64px; }

  header { padding: calc(28px + env(safe-area-inset-top)) 0 18px; border-bottom: 3px solid var(--ink); }
  .kicker {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase;
  }
  .kicker .live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: 1px;
  }
  h1 {
    font-family: "Anton", "Noto Sans JP", sans-serif;
    font-weight: 400; text-transform: uppercase;
    font-size: clamp(52px, 17vw, 104px); line-height: .9; letter-spacing: .01em;
    margin: 10px 0 6px;
  }
  h1 span { color: var(--accent); }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }

  nav {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0; border-bottom: 1px solid var(--rule);
    display: flex; gap: 8px; align-items: center;
  }
  nav button {
    font: inherit; font-size: 13px; font-weight: 500;
    border: 1px solid transparent; background: var(--chip-bg); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  nav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }

  section.day { margin-top: 26px; }
  .day h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; font-weight: 700; letter-spacing: .06em;
    margin: 0 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--ink);
  }
  .day h2 small { font-weight: 400; color: var(--muted); letter-spacing: 0; }

  ol { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--rule); }
  li a {
    display: grid; grid-template-columns: 46px 1fr; gap: 2px 12px;
    padding: 14px 0; color: inherit; text-decoration: none;
  }
  li a:active { opacity: .6; }
  @media (hover: hover) { li a:hover .title { text-decoration: underline; text-underline-offset: 3px; } }
  .time { grid-row: 1 / span 2; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 2px; }
  .title { font-size: 16px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
  .title[lang="en"] { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px;
  }
  .new { color: var(--accent); font-weight: 700; }

  .empty { padding: 48px 0; text-align: center; color: var(--muted); }
  footer { margin-top: 40px; font-size: 11px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span class="live">Auto-updated</span><span id="updated"></span></div>
    <h1>Bellingham<span>.</span></h1>
    <p class="sub">ジュード・ベリンガムのニュースを毎日自動収集</p>
  </header>

  <nav aria-label="言語の絞り込み">
    <button type="button" data-filter="all" aria-pressed="true">すべて</button>
    <button type="button" data-filter="ja" aria-pressed="false">日本語</button>
    <button type="button" data-filter="en" aria-pressed="false">English</button>
    <span class="count" id="count"></span>
  </nav>

  <main id="list"></main>

  <footer>
    見出しと元記事へのリンクのみを掲載しています。記事の内容は各媒体のサイトでご覧ください。<br>
    収集元: Google ニュース
  </footer>
</div>

<script id="news-data" type="application/json">__NEWS_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("news-data").textContent);
  var items = data.items || [];
  var list = document.getElementById("list");
  var countEl = document.getElementById("count");
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  var now = new Date();

  // 日付はすべて日本時間で表示
  function jst(d) { return new Date(d.getTime() + 9 * 3600 * 1000); }
  function dayKey(d) { var j = jst(d); return j.getUTCFullYear() + "-" + (j.getUTCMonth() + 1) + "-" + j.getUTCDate(); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { var j = jst(d); return pad(j.getUTCHours()) + ":" + pad(j.getUTCMinutes()); }
  function dayLabel(d) {
    var today = dayKey(now), yest = dayKey(new Date(now.getTime() - 86400000)), k = dayKey(d);
    var j = jst(d), base = (j.getUTCMonth() + 1) + "月" + j.getUTCDate() + "日（" + WEEK[j.getUTCDay()] + "）";
    if (k === today) return "今日 · " + base;
    if (k === yest) return "昨日 · " + base;
    return base;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var upd = new Date(data.updated);
  if (!isNaN(upd)) {
    var u = jst(upd);
    document.getElementById("updated").textContent =
      "更新 " + (u.getUTCMonth() + 1) + "/" + u.getUTCDate() + " " + hhmm(upd);
  }

  var filter = "all";
  try { filter = localStorage.getItem("bn-filter") || "all"; } catch (e) {}

  function render() {
    var shown = items.filter(function (i) { return filter === "all" || i.lang === filter; });
    countEl.textContent = shown.length + " 件";
    if (!shown.length) { list.innerHTML = '<p class="empty">まだ記事がありません</p>'; return; }

    var groups = [], byKey = {};
    shown.forEach(function (i) {
      var d = new Date(i.published), k = dayKey(d);
      if (!byKey[k]) { byKey[k] = { label: dayLabel(d), rows: [] }; groups.push(byKey[k]); }
      byKey[k].rows.push(i);
    });

    list.innerHTML = groups.map(function (g) {
      return '<section class="day"><h2>' + esc(g.label) + "<small>" + g.rows.length + " 件</small></h2><ol>" +
        g.rows.map(function (i) {
          var d = new Date(i.published);
          var fresh = now - d < 12 * 3600 * 1000;
          return '<li><a href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
            '<span class="time">' + hhmm(d) + "</span>" +
            '<span class="title" lang="' + esc(i.lang) + '">' + esc(i.title) + "</span>" +
            '<span class="meta">' + (fresh ? '<span class="new">NEW</span>' : "") +
            '<span class="tag">' + (i.lang === "ja" ? "JP" : "EN") + "</span>" +
            "<span>" + esc(i.source || "") + "</span></span></a></li>";
        }).join("") + "</ol></section>";
    }).join("");
  }

  document.querySelectorAll("nav button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.filter === filter ? "true" : "false");
    b.addEventListener("click", function () {
      filter = b.dataset.filter;
      try { localStorage.setItem("bn-filter", filter); } catch (e) {}
      document.querySelectorAll("nav button").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      render();
      window.scrollTo({ top: 0 });
    });
  });

  render();
})();
</script>
</body>
</html>
