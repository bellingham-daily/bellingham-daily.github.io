name: ニュース更新

on:
  schedule:
    # 日本時間 毎日 6:07 と 18:07（GitHubの時刻はUTCなので9時間引いて書く）
    - cron: "7 21 * * *"
    - cron: "7 9 * * *"
  workflow_dispatch: {} # Actions画面の「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースを集めてページを作り直す
        run: python scripts/update.py

      - name: 変更があれば保存する
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json docs/index.html
          if git diff --cached --quiet; then
            echo "新しい記事なし"
          else
            git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
